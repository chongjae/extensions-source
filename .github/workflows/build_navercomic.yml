name: Build NaverComic APK

on:
  push:
    branches: [ "**" ]
    paths:
      - 'src/ko/navercomic/**'
      - '.github/workflows/build_navercomic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build NaverComic extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :src:ko:navercomic:assembleRelease

      - name: Find APK
        id: apk
        run: |
          APK=$(find src/ko/navercomic/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navercomic-latest
          name: NaverComic APK (latest)
          body: "네이버 웹툰 extension APK (무료 회차만 표시)"
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
